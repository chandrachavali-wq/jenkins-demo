apiVersion: apps/v1
kind: Deployment

metadata:
  name: jenkins-webapp
  labels:
    app: jenkins-webapp

spec:
  replicas: 3

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: jenkins-webapp

  template:
    metadata:
      labels:
        app: jenkins-webapp

    spec:
      containers:
        - name: webapp
          image: jenkins-webapp:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8081

          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
